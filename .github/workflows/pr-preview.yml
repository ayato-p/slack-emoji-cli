name: PR プレビュー

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Go セットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ビルド
        run: go build -o emo ./cmd/emo

      - name: CJK フォントをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic
          fc-cache -fv
          # デバッグ：利用可能なフォントを確認
          echo "=== fc-list output ==="
          fc-list | grep -i noto || echo "Noto fonts not found"
          echo "=== Noto files in /usr/share/fonts ==="
          find /usr/share/fonts -name "*Noto*" -type f 2>/dev/null | head -10 || echo "No Noto files found"

      - name: プレビュー画像生成
        run: |
          mkdir -p preview-images

          # 基本テキスト
          ./emo -o preview-images/single-medium.png 'お気持ち'
          ./emo -o preview-images/multiline-2.png '猫に\小判'

          # 複数行（行幅自動圧縮）
          ./emo -o preview-images/multiline-width-diff.png '東京都\港区'
          ./emo -o preview-images/multiline-width-extreme.png 'ありがとう\ね'
          ./emo -o preview-images/multiline-width-3lines.png '東京都\港区\芝'

          # 背景色
          ./emo --bg '#E63946' -o preview-images/bg-red.png 'LGTM'
          ./emo --bg '#2ECC71' -o preview-images/bg-green.png '完了'
          ./emo --bg '#F39C12' -o preview-images/bg-orange.png '注意'
          ./emo --bg '#6C3483' -o preview-images/bg-purple.png 'WIP'

          # フォント色
          ./emo -c '#FF0000' -o preview-images/font-red.png 'Red'
          ./emo -c '#00FF00' -o preview-images/font-green.png 'Green'
          ./emo -c '#0000FF' -o preview-images/font-blue.png 'Blue'
          ./emo --bg '#000000' -c '#FFFFFF' -o preview-images/font-white-on-black.png 'White'

          # ゲーミング色
          ./emo --font-color gaming -o preview-images/gaming.gif 'Gaming'

          # 回転アニメ
          ./emo --rotate -o preview-images/rotate-single.gif 'LGTM'
          ./emo --rotate=reverse -o preview-images/rotate-reverse-single.gif 'LGTM'

          # 公転アニメ
          ./emo --revolve -o preview-images/revolve-2x2.gif 'ab\cd'
          ./emo --revolve=reverse -o preview-images/revolve-reverse-2x2.gif 'ab\cd'

          # 横スクロール
          ./emo --scroll-x -o preview-images/scroll-x-single.gif 'LGTM'
          ./emo --scroll-x=reverse -o preview-images/scroll-x-reverse.gif 'LGTM'

          # 縦スクロール
          ./emo --scroll-y -o preview-images/scroll-y-single.gif 'LGTM'
          ./emo --scroll-y=reverse -o preview-images/scroll-y-reverse.gif 'LGTM'

          # パルス
          ./emo --pulsing -o preview-images/pulsing.gif 'LGTM'
          ./emo --pulsing=reverse -o preview-images/pulsing-reverse.gif 'LGTM'

          # 速度調整
          ./emo --rotate --speed 0.5 -o preview-images/rotate-speed-slow.gif 'LGTM'
          ./emo --rotate --speed 2.0 -o preview-images/rotate-speed-fast.gif 'LGTM'

          # アニメーション組み合わせ
          ./emo --scroll-x --scroll-y -o preview-images/scroll-xy-single.gif 'LGTM'
          ./emo --scroll-x --rotate -o preview-images/scroll-x-rotate.gif 'LGTM'
          ./emo --pulsing --rotate -o preview-images/pulsing-rotate.gif 'GO'
          ./emo --pulsing --scroll-x -o preview-images/pulsing-scroll-x.gif 'LGTM'

          # カラー × アニメーション
          ./emo --rotate --bg '#E63946' -o preview-images/rotate-bg-red.gif '完了'
          ./emo --rotate -c '#FF0000' -o preview-images/rotate-font-red.gif 'LGTM'
          ./emo --font-color gaming --rotate -o preview-images/gaming-rotate.gif 'GO'
          ./emo --font-color gaming --revolve -o preview-images/gaming-revolve.gif 'GAME'
          ./emo --pulsing --font-color gaming -o preview-images/pulsing-gaming.gif 'RGB'

      - name: previews ブランチに画像をプッシュ
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          PR_NUMBER="${{ github.event.pull_request.number }}"

          # 画像を一時保存
          cp -r preview-images /tmp/preview-images

          # previews ブランチに切り替え（なければ作成）
          git fetch origin previews 2>/dev/null || true
          if git ls-remote --exit-code origin previews > /dev/null 2>&1; then
            git checkout previews
            git pull origin previews
          else
            git checkout --orphan previews
            git rm -rf . 2>/dev/null || true
            echo "# Preview Images" > README.md
            git add README.md
            git commit -m "Initialize previews branch"
          fi

          # PR用ディレクトリに画像をコピー
          mkdir -p "pr-${PR_NUMBER}"
          cp /tmp/preview-images/* "pr-${PR_NUMBER}/"

          git add "pr-${PR_NUMBER}"
          git diff --cached --quiet || git commit -m "preview: PR #${PR_NUMBER} [skip ci]"
          git push origin previews

      - name: PR にコメント
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const base = `https://raw.githubusercontent.com/${owner}/${repo}/previews/pr-${pr}`;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = [
              `## 絵文字プレビュー (${sha})`,
              '',
              '> ビルドコマンドで生成した絵文字のプレビューです。',
              '',
              '### 基本テキスト',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo 'お気持ち'\` | ![お気持ち](${base}/single-medium.png) |`,
              `| \`emo '猫に\\小判'\` | ![猫に\\小判](${base}/multiline-2.png) |`,
              '',
              '### 複数行（行幅自動圧縮）',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo '東京都\\港区'\` | ![東京都\\港区](${base}/multiline-width-diff.png) |`,
              `| \`emo 'ありがとう\\ね'\` | ![ありがとう\\ね](${base}/multiline-width-extreme.png) |`,
              `| \`emo '東京都\\港区\\芝'\` | ![東京都\\港区\\芝](${base}/multiline-width-3lines.png) |`,
              '',
              '### 背景色 (--bg)',
              '',
              '| 背景色 | コマンド | 出力 |',
              '|--------|---------|------|',
              `| 赤 (#E63946) | \`emo --bg '#E63946' 'LGTM'\` | ![LGTM](${base}/bg-red.png) |`,
              `| 緑 (#2ECC71) | \`emo --bg '#2ECC71' '完了'\` | ![完了](${base}/bg-green.png) |`,
              `| オレンジ (#F39C12) | \`emo --bg '#F39C12' '注意'\` | ![注意](${base}/bg-orange.png) |`,
              `| 紫 (#6C3483) | \`emo --bg '#6C3483' 'WIP'\` | ![WIP](${base}/bg-purple.png) |`,
              '',
              '### フォント色 (-c / --font-color)',
              '',
              '| フォント色 | コマンド | 出力 |',
              '|-----------|---------|------|',
              `| 赤 (#FF0000) | \`emo -c '#FF0000' 'Red'\` | ![Red](${base}/font-red.png) |`,
              `| 緑 (#00FF00) | \`emo -c '#00FF00' 'Green'\` | ![Green](${base}/font-green.png) |`,
              `| 青 (#0000FF) | \`emo -c '#0000FF' 'Blue'\` | ![Blue](${base}/font-blue.png) |`,
              `| 白 on 黒 | \`emo --bg '#000000' -c '#FFFFFF' 'White'\` | ![White](${base}/font-white-on-black.png) |`,
              '',
              '### ゲーミング色 (--font-color gaming)',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo --font-color gaming 'Gaming'\` | ![Gaming](${base}/gaming.gif) |`,
              '',
              '### 回転アニメ (--rotate)',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo --rotate 'LGTM'\` | ![LGTM](${base}/rotate-single.gif) |`,
              `| \`emo --rotate=reverse 'LGTM'\` | ![LGTM](${base}/rotate-reverse-single.gif) |`,
              '',
              '### 公転アニメ (--revolve)',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo --revolve 'ab\\cd'\` | ![ab\\cd](${base}/revolve-2x2.gif) |`,
              `| \`emo --revolve=reverse 'ab\\cd'\` | ![ab\\cd](${base}/revolve-reverse-2x2.gif) |`,
              '',
              '### 横スクロール (--scroll-x)',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo --scroll-x 'LGTM'\` | ![LGTM](${base}/scroll-x-single.gif) |`,
              `| \`emo --scroll-x=reverse 'LGTM'\` | ![LGTM](${base}/scroll-x-reverse.gif) |`,
              '',
              '### 縦スクロール (--scroll-y)',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo --scroll-y 'LGTM'\` | ![LGTM](${base}/scroll-y-single.gif) |`,
              `| \`emo --scroll-y=reverse 'LGTM'\` | ![LGTM](${base}/scroll-y-reverse.gif) |`,
              '',
              '### パルス (--pulsing)',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo --pulsing 'LGTM'\` | ![LGTM](${base}/pulsing.gif) |`,
              `| \`emo --pulsing=reverse 'LGTM'\` | ![LGTM](${base}/pulsing-reverse.gif) |`,
              '',
              '### 速度調整 (--speed)',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo --rotate --speed 0.5 'LGTM'\` | ![LGTM](${base}/rotate-speed-slow.gif) |`,
              `| \`emo --rotate --speed 2.0 'LGTM'\` | ![LGTM](${base}/rotate-speed-fast.gif) |`,
              '',
              '### アニメーション組み合わせ',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo --scroll-x --scroll-y 'LGTM'\` | ![LGTM](${base}/scroll-xy-single.gif) |`,
              `| \`emo --scroll-x --rotate 'LGTM'\` | ![LGTM](${base}/scroll-x-rotate.gif) |`,
              `| \`emo --pulsing --rotate 'GO'\` | ![GO](${base}/pulsing-rotate.gif) |`,
              `| \`emo --pulsing --scroll-x 'LGTM'\` | ![LGTM](${base}/pulsing-scroll-x.gif) |`,
              '',
              '### カラー × アニメーション',
              '',
              '| コマンド | 出力 |',
              '|---------|------|',
              `| \`emo --rotate --bg '#E63946' '完了'\` | ![完了](${base}/rotate-bg-red.gif) |`,
              `| \`emo --rotate -c '#FF0000' 'LGTM'\` | ![LGTM](${base}/rotate-font-red.gif) |`,
              `| \`emo --font-color gaming --rotate 'GO'\` | ![GO](${base}/gaming-rotate.gif) |`,
              `| \`emo --font-color gaming --revolve 'GAME'\` | ![GAME](${base}/gaming-revolve.gif) |`,
              `| \`emo --pulsing --font-color gaming 'RGB'\` | ![RGB](${base}/pulsing-gaming.gif) |`,
            ].join('\n');

            // 既存のボットコメントを探して更新、なければ作成
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith('## 絵文字プレビュー')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr,
                body,
              });
              console.log('Created new comment');
            }

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: previews ブランチからPR画像を削除
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          PR_NUMBER="${{ github.event.pull_request.number }}"

          git fetch origin previews 2>/dev/null || exit 0
          if ! git ls-remote --exit-code origin previews > /dev/null 2>&1; then
            exit 0
          fi

          git checkout previews
          git pull origin previews

          if [ -d "pr-${PR_NUMBER}" ]; then
            git rm -rf "pr-${PR_NUMBER}"
            git commit -m "cleanup: PR #${PR_NUMBER} [skip ci]"
            git push origin previews
          fi
