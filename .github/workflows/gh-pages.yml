name: gh-pages デプロイ

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Go セットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ビルド
        run: go build -o emo ./cmd/emo

      - name: CJK フォントをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic
          fc-cache -fv
          # デバッグ：利用可能なフォントを確認
          echo "=== fc-list output ==="
          fc-list | grep -i noto || echo "Noto fonts not found"
          echo "=== Noto files in /usr/share/fonts ==="
          find /usr/share/fonts -name "*Noto*" -type f 2>/dev/null | head -10 || echo "No Noto files found"

      - name: サンプル画像生成
        run: |
          mkdir -p sample-images

          # 基本テキスト
          ./emo -o sample-images/single-medium.png 'お気持ち'
          ./emo -o sample-images/multiline-2.png '猫に\小判'

          # 背景色
          ./emo --bg '#E63946' -o sample-images/bg-red.png 'LGTM'
          ./emo --bg '#2ECC71' -o sample-images/bg-green.png '完了'
          ./emo --bg '#F39C12' -o sample-images/bg-orange.png '注意'
          ./emo --bg '#6C3483' -o sample-images/bg-purple.png 'WIP'

          # フォント色
          ./emo -c '#FF0000' -o sample-images/font-red.png 'Red'
          ./emo -c '#00FF00' -o sample-images/font-green.png 'Green'
          ./emo -c '#0000FF' -o sample-images/font-blue.png 'Blue'
          ./emo --bg '#000000' -c '#FFFFFF' -o sample-images/font-white-on-black.png 'White'

          # ゲーミング色
          ./emo --font-color gaming -o sample-images/gaming.gif 'Gaming'

          # 回転アニメ
          ./emo --rotate -o sample-images/rotate-single.gif 'LGTM'
          ./emo --rotate=reverse -o sample-images/rotate-reverse-single.gif 'LGTM'

          # 公転アニメ
          ./emo --revolve -o sample-images/revolve-2x2.gif 'ab\cd'
          ./emo --revolve=reverse -o sample-images/revolve-reverse-2x2.gif 'ab\cd'

          # 横スクロール
          ./emo --scroll-x -o sample-images/scroll-x-single.gif 'LGTM'
          ./emo --scroll-x=reverse -o sample-images/scroll-x-reverse.gif 'LGTM'

          # 縦スクロール
          ./emo --scroll-y -o sample-images/scroll-y-single.gif 'LGTM'
          ./emo --scroll-y=reverse -o sample-images/scroll-y-reverse.gif 'LGTM'

          # パルス
          ./emo --pulsing -o sample-images/pulsing.gif 'LGTM'
          ./emo --pulsing=reverse -o sample-images/pulsing-reverse.gif 'LGTM'

          # 速度調整
          ./emo --rotate --speed 0.5 -o sample-images/rotate-speed-slow.gif 'LGTM'
          ./emo --rotate --speed 2.0 -o sample-images/rotate-speed-fast.gif 'LGTM'

          # アニメーション組み合わせ
          ./emo --scroll-x --scroll-y -o sample-images/scroll-xy-single.gif 'LGTM'
          ./emo --scroll-x --rotate -o sample-images/scroll-x-rotate.gif 'LGTM'
          ./emo --pulsing --rotate -o sample-images/pulsing-rotate.gif 'GO'
          ./emo --pulsing --scroll-x -o sample-images/pulsing-scroll-x.gif 'LGTM'

          # カラー × アニメーション
          ./emo --rotate --bg '#E63946' -o sample-images/rotate-bg-red.gif '完了'
          ./emo --rotate -c '#FF0000' -o sample-images/rotate-font-red.gif 'LGTM'
          ./emo --font-color gaming --rotate -o sample-images/gaming-rotate.gif 'GO'
          ./emo --font-color gaming --revolve -o sample-images/gaming-revolve.gif 'GAME'
          ./emo --pulsing --font-color gaming -o sample-images/pulsing-gaming.gif 'RGB'

      - name: index.html 生成
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          cat > sample-images/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>slack-emoji-cli サンプル</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: #f6f8fa;
                color: #24292f;
                padding: 2rem;
              }
              h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
              .subtitle {
                color: #57606a;
                margin-bottom: 2rem;
                font-size: 0.9rem;
              }
              .subtitle a { color: #0969da; text-decoration: none; }
              .subtitle a:hover { text-decoration: underline; }
              h2 { font-size: 1.2rem; margin: 2rem 0 1rem; border-bottom: 1px solid #d0d7de; padding-bottom: 0.5rem; }
              table {
                border-collapse: collapse;
                width: 100%;
                background: #fff;
                border: 1px solid #d0d7de;
                border-radius: 6px;
                overflow: hidden;
              }
              th {
                background: #f6f8fa;
                padding: 0.6rem 1rem;
                text-align: left;
                font-size: 0.85rem;
                border-bottom: 1px solid #d0d7de;
              }
              td {
                padding: 0.6rem 1rem;
                border-bottom: 1px solid #d0d7de;
                font-size: 0.9rem;
                vertical-align: middle;
              }
              tr:last-child td { border-bottom: none; }
              code {
                background: #f6f8fa;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                padding: 0.15em 0.4em;
                font-size: 0.85em;
                font-family: "SFMono-Regular", Consolas, monospace;
              }
              img { image-rendering: pixelated; width: 64px; height: 64px; }
              footer {
                margin-top: 3rem;
                font-size: 0.8rem;
                color: #57606a;
              }
