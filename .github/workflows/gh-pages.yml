name: gh-pages デプロイ

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Go セットアップ
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: ビルド
        run: go build -o emo .

      - name: CJK フォントをインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: サンプル画像生成
        run: |
          mkdir -p sample-images

          # 1行パターン
          ./emo -o sample-images/single-short.png '猫'
          ./emo -o sample-images/single-medium.png 'お気持ち'

          # 改行含むパターン
          ./emo -o sample-images/multiline-2.png '猫に\小判'
          ./emo -o sample-images/multiline-long.png 'ありがとう\ございます'

          # 背景色が異なるパターン
          ./emo --bg '#E63946' -o sample-images/bg-red.png 'LGTM'
          ./emo --bg '#2ECC71' -o sample-images/bg-green.png '完了'
          ./emo --bg '#F39C12' -o sample-images/bg-orange.png '注意'
          ./emo --bg '#6C3483' -o sample-images/bg-purple.png 'WIP'

          # 回転アニメパターン
          ./emo --rotate -o sample-images/rotate-single.gif 'LGTM'
          ./emo --rotate -o sample-images/rotate-multi.gif '猫に\小判'
          ./emo --rotate --bg '#E63946' -o sample-images/rotate-bg-red.gif '完了'

          # 回転アニメ（リバース）パターン
          ./emo --rotate=reverse -o sample-images/rotate-reverse-single.gif 'LGTM'
          ./emo --rotate=reverse -o sample-images/rotate-reverse-multi.gif '猫に\小判'

          # 公転アニメパターン
          ./emo --revolve -o sample-images/revolve-2x2.gif 'ab\cd'
          ./emo --revolve -o sample-images/revolve-multi.gif '猫に\小判'
          ./emo --revolve --bg '#E63946' -o sample-images/revolve-bg-red.gif 'ab\cd'

          # 公転アニメ（リバース）パターン
          ./emo --revolve=reverse -o sample-images/revolve-reverse-2x2.gif 'ab\cd'
          ./emo --revolve=reverse -o sample-images/revolve-reverse-multi.gif '猫に\小判'

          # 速度調整パターン
          ./emo --rotate --speed 0.5 -o sample-images/rotate-speed-slow.gif 'LGTM'
          ./emo --rotate --speed 2.0 -o sample-images/rotate-speed-fast.gif 'LGTM'
          ./emo --revolve --speed 0.5 -o sample-images/revolve-speed-slow.gif 'ab\cd'
          ./emo --revolve --speed 2.0 -o sample-images/revolve-speed-fast.gif 'ab\cd'

          # 横スクロールアニメパターン
          ./emo --scroll-x -o sample-images/scroll-x-single.gif 'LGTM'
          ./emo --scroll-x -o sample-images/scroll-x-multi.gif '猫に\小判'
          ./emo --scroll-x=reverse -o sample-images/scroll-x-reverse.gif 'LGTM'

          # 縦スクロールアニメパターン
          ./emo --scroll-y -o sample-images/scroll-y-single.gif 'LGTM'
          ./emo --scroll-y -o sample-images/scroll-y-multi.gif '猫に\小判'
          ./emo --scroll-y=reverse -o sample-images/scroll-y-reverse.gif 'LGTM'

          # スクロール組み合わせパターン
          ./emo --scroll-x --scroll-y -o sample-images/scroll-xy-single.gif 'LGTM'
          ./emo --scroll-x --rotate -o sample-images/scroll-x-rotate.gif 'LGTM'

      - name: index.html 生成
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          cat > sample-images/index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>slack-emoji-cli サンプル</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                background: #f6f8fa;
                color: #24292f;
                padding: 2rem;
              }
              h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
              .subtitle {
                color: #57606a;
                margin-bottom: 2rem;
                font-size: 0.9rem;
              }
              .subtitle a { color: #0969da; text-decoration: none; }
              .subtitle a:hover { text-decoration: underline; }
              h2 { font-size: 1.2rem; margin: 2rem 0 1rem; border-bottom: 1px solid #d0d7de; padding-bottom: 0.5rem; }
              table {
                border-collapse: collapse;
                width: 100%;
                background: #fff;
                border: 1px solid #d0d7de;
                border-radius: 6px;
                overflow: hidden;
              }
              th {
                background: #f6f8fa;
                padding: 0.6rem 1rem;
                text-align: left;
                font-size: 0.85rem;
                border-bottom: 1px solid #d0d7de;
              }
              td {
                padding: 0.6rem 1rem;
                border-bottom: 1px solid #d0d7de;
                font-size: 0.9rem;
                vertical-align: middle;
              }
              tr:last-child td { border-bottom: none; }
              code {
                background: #f6f8fa;
                border: 1px solid #d0d7de;
                border-radius: 4px;
                padding: 0.15em 0.4em;
                font-size: 0.85em;
                font-family: "SFMono-Regular", Consolas, monospace;
              }
              img { image-rendering: pixelated; width: 64px; height: 64px; }
              footer {
                margin-top: 3rem;
                font-size: 0.8rem;
                color: #57606a;
              }
            </style>
          </head>
          <body>
            <h1>slack-emoji-cli サンプル</h1>
            <p class="subtitle">
