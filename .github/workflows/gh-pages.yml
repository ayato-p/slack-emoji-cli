      - name: gh-pages ブランチにデプロイ
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          cp -r sample-images /tmp/sample-images

          git fetch origin gh-pages 2>/dev/null || true
          if git ls-remote --exit-code origin gh-pages > /dev/null 2>&1; then
            git checkout gh-pages
            git pull origin gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/sample-images/*.png .
          cp /tmp/sample-images/*.gif .
          cp /tmp/sample-images/index.html .

          git add *.png *.gif index.html
          git diff --cached --quiet || git commit -m "deploy: gh-pages サンプル更新 [skip ci]"
          git push origin gh-pages
